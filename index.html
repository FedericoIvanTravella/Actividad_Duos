<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body>
    <header class="encabezado">
      <img src="src/Logo.png" alt="Logo" title="LogoTipo" />
      <nav class="menu">
        <a href="">Nosotros</a>
        <a href="">Galería</a>
        <a href="">Productos</a>
        <a href="" class="btncontactos">Contactos</a>
      </nav>
    </header>

    <div class="carrusel">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="src/carrusel/a.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="src/carrusel/b.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="src/carrusel/c.png" class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <main>
      <div class="contenedor"></div>
    </main>

    <footer>
       <div class="infofooter">
          <img src="src/Logo.png" alt="">
            
          <div class="logofooter">
            <img src="src/redes/yt.png" alt="">
            <img src="src/redes/x.png" alt="">
            <img src="src/redes/facebook.png" alt="">
            <img src="src/redes/ig.png" alt="">
            <img src="src/redes/tiktok.png" alt="">
          </div>
          <P>© 2026 WarnerMedia Direct, LLC. All rights reserved.</P>
       </div>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3274.628244487518!2d-58.46701282444742!3d-34.84043837287022!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcd6aaca975e65%3A0x7e7f33de3d236b75!2sG%C3%BCemes%202051%2C%20B1842%20Monte%20Grande%2C%20Provincia%20de%20Buenos%20Aires!5e0!3m2!1ses-419!2sar!4v1775550780496!5m2!1ses-419!2sar"
            width="600" height="350" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

        <div class="infonav">
            <nav>
                <h1>Secciones de la Página</h1>
                <a href="">Nosotros</a>
                <a href="">Productos</a>
                <a href="">Galeria</a>
                <a href="">Contactos</a>
            </nav>
        </div>
    </footer>
    
    <script type="module" src="Script/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
